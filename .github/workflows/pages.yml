name: Verify and deploy MASTER INVEST
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: masterinvest-pages
  cancel-in-progress: false
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npm audit --audit-level=high
      - run: npx playwright install --with-deps chromium firefox webkit
        if: vars.RUN_BROWSER_QA == 'true'
      - run: npm run test:browser
        if: vars.RUN_BROWSER_QA == 'true'
        env:
          BROWSERS: chromium,firefox,webkit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: masterinvest-quality-evidence
          path: evidence/
  build:
    if: vars.PUBLISH_SITE == 'true'
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: masterinvest-quality-evidence
          path: evidence/
      - run: npm run build
        env:
          RELEASE_APPROVED: ${{ vars.RELEASE_APPROVED || 'false' }}
          PUBLIC_EMAILJS_ENABLED: ${{ vars.PUBLIC_EMAILJS_ENABLED || 'false' }}
          PUBLIC_EMAILJS_DELIVERY_VERIFIED: ${{ vars.PUBLIC_EMAILJS_DELIVERY_VERIFIED || 'false' }}
          PUBLIC_EMAILJS_SERVICE_ID: ${{ vars.PUBLIC_EMAILJS_SERVICE_ID }}
          PUBLIC_EMAILJS_PUBLIC_KEY: ${{ vars.PUBLIC_EMAILJS_PUBLIC_KEY }}
          PUBLIC_EMAILJS_NOTIFICATION_TEMPLATE: ${{ vars.PUBLIC_EMAILJS_NOTIFICATION_TEMPLATE }}
          PUBLIC_EMAILJS_AUTOREPLY_TEMPLATE: ${{ vars.PUBLIC_EMAILJS_AUTOREPLY_TEMPLATE }}
          SITE_ORIGIN: https://masterinvest.gr
      - run: npm run release:check
        if: vars.RELEASE_APPROVED == 'true'
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the new MASTER INVEST site
        id: deployment
        uses: actions/deploy-pages@v4
